<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>南京行程 每日路線地圖</title>
<style>
  :root {
    --cream: #FAF7F0;
    --white: #FFFFFF;
    --dark: #2B2A26;
    --gray: #6B6A63;
    --lgray: #9B9A92;
    --border: #E4DFD3;
    --light: #F1ECE0;
    --accent: #B5793A;
    --accent2: #6E8B6E;
  }
  [data-theme="dark"] {
    --cream: #0D0F1C;
    --white: #161929;
    --dark: #DDE3F5;
    --gray: #8B96B5;
    --lgray: #596285;
    --border: #242845;
    --light: #1A1E33;
    --accent: #E0A85E;
    --accent2: #8FBF8F;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: var(--cream);
    color: var(--dark);
    transition: background .3s, color .3s;
    padding-bottom: 80px;
  }
  header { padding: 32px 20px 16px; text-align: center; border-bottom: 1px solid var(--border); }
  header h1 { margin: 0 0 6px; font-size: 1.5rem; }
  header p { margin: 0; color: var(--gray); font-size: .9rem; }
  header a.backlink { display: inline-block; margin-top: 10px; font-size: .85rem; color: var(--accent); text-decoration: none; }
  header a.backlink:hover { text-decoration: underline; }

  .container { max-width: 860px; margin: 0 auto; padding: 20px 16px; }

  .tabs {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 8px;
    margin-bottom: 18px;
    -webkit-overflow-scrolling: touch;
  }
  .tabs::-webkit-scrollbar { height: 4px; }
  .tab-btn {
    flex: 0 0 auto;
    padding: 9px 16px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--white);
    color: var(--gray);
    font-size: .85rem;
    cursor: pointer;
    white-space: nowrap;
    transition: all .2s;
  }
  .tab-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 700;
  }

  .day-panel { display: none; }
  .day-panel.active { display: block; }

  .day-info {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
    margin-bottom: 14px;
  }
  .day-info h2 { margin: 0 0 4px; font-size: 1.1rem; }
  .day-info .date { color: var(--gray); font-size: .82rem; margin-bottom: 12px; }

  .stop-list { list-style: none; margin: 0; padding: 0; }
  .stop-list li {
    display: flex; align-items: center; gap: 10px;
    padding: 7px 0; font-size: .88rem; border-bottom: 1px dashed var(--border);
  }
  .stop-list li:last-child { border-bottom: none; }
  .stop-num {
    flex: 0 0 auto;
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--light); color: var(--accent);
    font-size: .75rem; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }

  .map-frame-wrap {
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    background: var(--white);
  }
  .map-frame-wrap iframe {
    width: 100%; height: 420px; border: 0; display: block;
  }

  .note-box {
    background: var(--light);
    border-left: 3px solid var(--accent2);
    border-radius: 8px;
    padding: 12px 16px;
    margin-top: 16px;
    font-size: .82rem;
    color: var(--gray);
    line-height: 1.6;
  }

  footer { text-align: center; color: var(--lgray); font-size: .78rem; padding: 20px; }

  .theme-toggle {
    position: fixed; bottom: 24px; right: 20px; z-index: 999;
    width: 48px; height: 48px; border-radius: 50%; border: none;
    cursor: pointer; font-size: 22px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 3px 14px rgba(0,0,0,.25);
    transition: background .3s, transform .2s;
    background: #fff; color: #333;
  }
  .theme-toggle:hover { transform: scale(1.1); }
  [data-theme="dark"] .theme-toggle {
    background: #1E2340; color: #DDE3F5;
    box-shadow: 0 3px 14px rgba(0,0,0,.5);
  }

  @media (max-width: 600px) {
    header h1 { font-size: 1.25rem; }
    .map-frame-wrap iframe { height: 320px; }
    .tab-btn { font-size: .8rem; padding: 8px 13px; }
  }
</style>
</head>
<body>

<button class="theme-toggle" id="themeBtn" onclick="toggleTheme()" title="切換深色／淺色模式">🌙</button>

<header>
  <h1>南京行程 每日路線地圖</h1>
  <p>2026年8月2日（日）— 8月8日（六）｜以 Google 地圖呈現每日移動路徑</p>
  <a class="backlink" href="./index.html">← 回完整行程時間表</a>
</header>

<div class="container">

  <div class="tabs" id="tabs"></div>

  <div id="panels"></div>

  <div class="note-box">
    💡 地圖為 Google 地圖自動規劃的示意路線（多為駕車模式），實際步行動線與時間請依現場路況與導航App為準。點地圖右上角可放大或切換至完整版 Google 地圖操作路線導航。
  </div>

</div>

<footer>南京行程・每日路線地圖・最後更新 2026-07-31</footer>

<script>
const DAYS = [
  {
    key: "d1", label: "Day1", date: "8/2（日）",
    title: "抵達南京・中華門甕城・大報恩寺／塔・秦淮夜遊",
    stops: ["南京南站", "南京金陵飯店 漢中路2號 南京", "南京城牆中華門 南京", "大報恩寺遺址景區 南京", "夫子廟 秦淮河 南京"]
  },
  {
    key: "d2", label: "Day2", date: "8/3（一）",
    title: "雞鳴寺・台城城牆・玄武湖",
    stops: ["南京金陵飯店 南京", "雞鳴寺 南京", "南京城牆台城 南京", "玄武湖公園解放門 南京", "太平門 南京", "玄武湖公園解放門 南京", "玄武門 南京", "玄武湖環洲先鋒書店 南京", "玄武湖環洲 南京", "玄武湖菱洲 南京", "玄武湖梁洲 南京", "玄武湖翠洲 南京"]
  },
  {
    key: "d3", label: "Day3", date: "8/4（二）",
    title: "牛首山・夫子廟・秦淮夜遊",
    stops: ["南京金陵飯店 南京", "牛首山文化旅遊區東入口 南京", "南京金陵飯店 南京", "夫子廟大成殿 南京", "江南貢院 南京", "瞻園 南京", "太平天國歷史博物館 南京", "鈔庫街 南京", "夫子廟秦淮遊船碼頭 南京"]
  },
  {
    key: "d4", label: "Day4", date: "8/5（三）",
    title: "明孝陵・中山陵・中山碼頭・浦口",
    stops: ["南京金陵飯店 南京", "明孝陵 南京", "中山陵 南京", "中山碼頭 南京", "浦口火車站舊址 南京", "德基廣場 南京"]
  },
  {
    key: "d5", label: "Day5", date: "8/6（四）",
    title: "南京博物院・轉住河西・南京眼",
    stops: ["南京金陵飯店 南京", "南京博物院 南京", "南京新華傳媒大酒店 江東中路363號 南京", "南京眼步行橋 南京"]
  },
  {
    key: "d6", label: "Day6", date: "8/7（五）",
    title: "用友商業創新大會（全天）",
    stops: ["南京新華傳媒大酒店 南京", "南京國際博覽中心 江東中路300號 南京"]
  },
  {
    key: "d7", label: "Day7", date: "8/8（六）",
    title: "阿里南京參訪・返程",
    stops: ["南京新華傳媒大酒店 南京", "阿里巴巴江蘇總部 南京", "南京南站"]
  }
];

function buildMapSrc(stops) {
  const saddr = encodeURIComponent(stops[0]);
  const daddr = stops.slice(1).map(s => encodeURIComponent(s)).join("+to:");
  return `https://maps.google.com/maps?saddr=${saddr}&daddr=${daddr}&output=embed`;
}

const tabsEl = document.getElementById("tabs");
const panelsEl = document.getElementById("panels");

DAYS.forEach((day, i) => {
  const btn = document.createElement("button");
  btn.className = "tab-btn" + (i === 0 ? " active" : "");
  btn.textContent = day.label;
  btn.dataset.key = day.key;
  btn.onclick = () => switchDay(day.key);
  tabsEl.appendChild(btn);

  const panel = document.createElement("div");
  panel.className = "day-panel" + (i === 0 ? " active" : "");
  panel.id = "panel-" + day.key;

  const stopsHtml = day.stops.map((s, idx) =>
    `<li><span class="stop-num">${idx + 1}</span><span>${s.replace(/\s*南京\s*$/, "")}</span></li>`
  ).join("");

  panel.innerHTML = `
    <div class="day-info">
      <h2>${day.label}・${day.title}</h2>
      <div class="date">${day.date}</div>
      <ul class="stop-list">${stopsHtml}</ul>
    </div>
    <div class="map-frame-wrap">
      <iframe loading="lazy" src="${buildMapSrc(day.stops)}" allowfullscreen></iframe>
    </div>
  `;
  panelsEl.appendChild(panel);
});

function switchDay(key) {
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.toggle("active", b.dataset.key === key));
  document.querySelectorAll(".day-panel").forEach(p => p.classList.toggle("active", p.id === "panel-" + key));
}

function toggleTheme() {
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  const next = isDark ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  document.getElementById('themeBtn').textContent = next === 'dark' ? '☀️' : '🌙';
  localStorage.setItem('page-theme', next);
}
(function() {
  const saved = localStorage.getItem('page-theme') || 'light';
  if (saved === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
    document.getElementById('themeBtn').textContent = '☀️';
  }
})();
</script>

</body>
</html>
